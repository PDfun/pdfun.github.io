<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikus Squeeze — redirecting…</title>
<style>
  body{margin:0;background:#15171A;color:#ECEAE2;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .box{max-width:420px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#2BB7A6;display:inline-block;margin-bottom:16px;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  p{font-size:14px;color:#8A8D85;line-height:1.6;}
  a{color:#2BB7A6;}
</style>
</head>
<body>
<div class="box">
  <div class="dot"></div>
  <p id="msg">Redirecting…</p>
</div>
<script>
(async function(){
  const msg = document.getElementById('msg');
  const code = decodeURIComponent(location.hash.slice(1));

  // Figure out owner/repo from the current URL so this file works
  // no matter what repo it's deployed in.
  const parts = location.pathname.split('/').filter(Boolean).filter(p => p !== 'go.html');
  const host = location.hostname; // e.g. username.github.io
  const owner = host.split('.')[0];
  const isRootSite = host === owner + '.github.io' && parts.length === 0;
  const repo = isRootSite ? (owner + '.github.io') : parts[0];
  const branch = 'main';

  if(!code){
    msg.textContent = 'No short code given.';
    return;
  }

  function b64decode(str){ return decodeURIComponent(escape(atob(str))); }

  async function lookupViaApi(){
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/links.json?ref=${branch}`, {
      cache: 'no-store', headers: { 'Accept': 'application/vnd.github+json' }
    });
    if(!res.ok) throw new Error('api failed');
    const json = await res.json();
    return JSON.parse(b64decode(json.content));
  }

  async function lookupViaRaw(){
    const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/links.json?_=${Date.now()}`, { cache: 'no-store' });
    if(!res.ok) throw new Error('raw failed');
    return res.json();
  }

  for(let tries = 3; tries >= 0; tries--){
    try{
      const data = await lookupViaApi().catch(lookupViaRaw);
      const dest = data[code];
      if(dest){ location.replace(dest); return; }
    }catch(e){}
    if(tries > 0) await new Promise(r => setTimeout(r, 1200));
  }
  msg.textContent = "This link doesn't exist or hasn't propagated yet — try again in a moment.";
})();
</script>
</body>
</html>
